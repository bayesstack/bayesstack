# Native Windows Nginx configuration for all BayesStack core profiles.
# Docker uses nginx.conf and conf.d/bayesstack.conf, which target container names.

worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Landing site and shared FastAPI routes
    server {
        listen 80;
        server_name localhost 127.0.0.1 landing.localhost;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
        }

        location /docs {
            proxy_pass http://127.0.0.1:8000;
        }

        location /openapi.json {
            proxy_pass http://127.0.0.1:8000;
        }

        location /health {
            proxy_pass http://127.0.0.1:8000;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
        }
    }

    # The app-specific local hostnames are optional conveniences. Every app
    # remains directly accessible on its documented localhost port.
    server {
        listen 80;
        server_name super.localhost;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        location / { proxy_pass http://127.0.0.1:3005; }
    }

    server {
        listen 80;
        server_name auth.localhost;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        location / { proxy_pass http://127.0.0.1:3004; }
    }

    server {
        listen 80;
        server_name learner.localhost;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        location / { proxy_pass http://127.0.0.1:3001; }
    }

    server {
        listen 80;
        server_name faculty.localhost;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        location / { proxy_pass http://127.0.0.1:3002; }
    }

    server {
        listen 80;
        server_name admin.localhost;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        location / { proxy_pass http://127.0.0.1:3003; }
    }

    # Tenant hostnames retain the production-style app paths when local DNS
    # aliases are configured. The direct localhost ports do not need aliases.
    server {
        listen 80;
        server_name bayes.localhost ashoka.localhost coep.localhost vjti.localhost;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        location /api/ { proxy_pass http://127.0.0.1:8000; }
        location /learner { proxy_pass http://127.0.0.1:3001; }
        location /faculty { proxy_pass http://127.0.0.1:3002; }
        location /admin { proxy_pass http://127.0.0.1:3003; }
        location / { proxy_pass http://127.0.0.1:3004; }
    }
}
