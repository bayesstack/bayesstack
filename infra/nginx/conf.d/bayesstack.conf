# BayesStack Dynamic Multi-Tenant Gateway & Reverse Proxy Configuration
# Supports selective multi-service startup without requiring all frontends to be active.

# Docker embedded DNS resolver (127.0.0.11) with fallback for host local DNS
resolver 127.0.0.11 127.0.0.53 8.8.8.8 valid=10s ipv6=off;

# 1. Root Domain Gateway (bayesstack.com, www.bayesstack.com, localhost)
server {
    listen 80;
    server_name localhost bayesstack.com www.bayesstack.com 127.0.0.1;

    # Global proxy header defaults
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Dynamic target variables
    set $target_api http://api:8000;
    set $target_auth http://auth:3000;
    set $target_landing http://landing:3000;

    # API Backend routes
    location /api/ {
        proxy_pass $target_api;
    }

    # API docs & OpenAPI specs
    location /docs {
        proxy_pass $target_api;
    }
    location /openapi.json {
        proxy_pass $target_api;
    }

    # Shared Auth routes on root domain
    location ~ ^/(login|signup|sso|auth|reset) {
        proxy_pass $target_auth;
    }

    # Root marketing site (Landing App)
    location / {
        proxy_pass $target_landing;
    }
}

# 2. Platform SuperAdmin Gateway (super.localhost, super.bayesstack.com)
server {
    listen 80;
    server_name super.localhost super.bayesstack.com;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    set $target_api http://api:8000;
    set $target_super http://super:3000;

    # API Backend routes for SuperAdmin
    location /api/ {
        proxy_pass $target_api;
    }

    # Platform SuperAdmin Control Plane App
    location / {
        proxy_pass $target_super;
    }
}

# 3. Multi-Tenant Wildcard Subdomain Gateway (*.localhost, *.bayesstack.com)
server {
    listen 80;
    server_name ~^(?<tenant>[a-z0-9-]+)\.(localhost|bayesstack\.com)$ ;

    # Global proxy header defaults with tenant context
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Tenant-Slug $tenant;

    # Dynamic target variables
    set $target_api http://api:8000;
    set $target_auth http://auth:3000;
    set $target_learner http://learner:3000;
    set $target_faculty http://faculty:3000;
    set $target_admin http://admin:3000;

    # API Backend routes for tenant
    location /api/ {
        proxy_pass $target_api;
    }

    # Shared Auth App routes for tenant
    location ~ ^/(login|signup|sso|auth|reset) {
        proxy_pass $target_auth;
    }

    # Learner Portal App (/learner)
    location /learner {
        proxy_pass $target_learner;
    }

    # Faculty Portal App (/faculty)
    location /faculty {
        proxy_pass $target_faculty;
    }

    # Admin Portal App (/admin)
    location /admin {
        proxy_pass $target_admin;
    }

    # Next.js Static Asset & HMR Handlers
    location /_next/ {
        proxy_pass $target_auth;
    }

    # Default tenant root hit (Forward to Auth App login/signup portal)
    location / {
        proxy_pass $target_auth;
    }
}
