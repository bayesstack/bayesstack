name: bayesstack

services:
  postgres:
    image: postgres:16-alpine
    container_name: bayesstack_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: bayesstack
      POSTGRES_PASSWORD: bayesstack_dev
      POSTGRES_DB: bayesstack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bayesstack -d bayesstack"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bayesstack_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bayesstack.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      BAYESSTACK_ENV: development
      BASE_DOMAINS: localhost,bayesstack.com
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: bayesstack
      POSTGRES_PASSWORD: bayesstack_dev
      POSTGRES_DB: bayesstack
      DATABASE_URL: postgresql+asyncpg://bayesstack:bayesstack_dev@postgres:5432/bayesstack
      JUDGE_SERVICE_URL: http://coding-judge:2358
      JUDGE_SERVICE_TOKEN: ${JUDGE_SERVICE_TOKEN:-}
    volumes:
      - ./services/api/src:/app/src
    command: uvicorn main:app --app-dir src --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      - ./studios:/app/studios
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

  learner:
    build:
      context: .
      dockerfile: apps/learner/Dockerfile
      target: dev
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      - ./studios:/app/studios
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

  faculty:
    build:
      context: .
      dockerfile: apps/faculty/Dockerfile
      target: dev
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      - ./studios:/app/studios
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      target: dev
    ports:
      - "3003:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      - ./studios:/app/studios
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      target: dev
    ports:
      - "3004:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      - ./studios:/app/studios
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

  super:
    build:
      context: .
      dockerfile: apps/super/Dockerfile
      target: dev
    ports:
      - "3005:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      - ./studios:/app/studios
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

  coding-judge:
    build:
      context: ./studios/coding/backend
      dockerfile: Dockerfile
    container_name: bayesstack_coding_judge
    restart: unless-stopped
    environment:
      PORT: 2358
      ENVIRONMENT: development
      EXECUTION_PROVIDER: ${EXECUTION_PROVIDER:-mock}
      PISTON_BASE_URL: http://piston:2000
      JUDGE_SERVICE_TOKEN: ${JUDGE_SERVICE_TOKEN:-}
    volumes:
      - ./studios/coding/backend/src:/app/src
    command: uvicorn main:app --app-dir src --host 0.0.0.0 --port 2358 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2358/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - judge_internal

  # Optional execution runtime. It has no host port and is reachable only from
  # coding-judge on an internal Docker network. Start with --profile execution.
  piston:
    # Immutable digest for the upstream image; review/update deliberately.
    image: ghcr.io/engineer-man/piston@sha256:2f66b7456189c4d713aa986d98eccd0b6ee16d26c7ec5f21b30e942756fd127a
    profiles: ["execution"]
    restart: unless-stopped
    privileged: true
    # Development convenience only: loopback keeps the API off the LAN/WAN.
    # Production should omit this mapping entirely.
    ports:
      - "127.0.0.1:2000:2000"
    networks:
      - judge_internal

  nginx:
    image: nginx:alpine
    container_name: bayesstack_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:

networks:
  judge_internal:
    internal: true
