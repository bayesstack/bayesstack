name: bayesstack

services:
  postgres:
    image: postgres:16-alpine
    container_name: bayesstack_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: bayesstack
      POSTGRES_PASSWORD: bayesstack_dev
      POSTGRES_DB: bayesstack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bayesstack -d bayesstack"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bayesstack_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bayesstack.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      BAYESSTACK_ENV: development
      BASE_DOMAINS: localhost,bayesstack.com
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: bayesstack
      POSTGRES_PASSWORD: bayesstack_dev
      POSTGRES_DB: bayesstack
      DATABASE_URL: postgresql+asyncpg://bayesstack:bayesstack_dev@postgres:5432/bayesstack
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  landing:
    build:
      context: .
      dockerfile: infra/docker/next.Dockerfile
      args:
        APP_NAME: landing
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

  learner:
    build:
      context: .
      dockerfile: infra/docker/next.Dockerfile
      args:
        APP_NAME: learner
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

  faculty:
    build:
      context: .
      dockerfile: infra/docker/next.Dockerfile
      args:
        APP_NAME: faculty
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: infra/docker/next.Dockerfile
      args:
        APP_NAME: admin
    ports:
      - "3003:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
